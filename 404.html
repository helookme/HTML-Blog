<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 页面走丢了 | AkiNard Blog</title>
  <meta name="description" content="这个页面走丢了，返回 AkiNard Blog 首页看看其他内容吧。">
  <meta name="robots" content="noindex">
  <meta name="author" content="SkyCeria">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1c22" media="(prefers-color-scheme: dark)">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --glass-bg: rgba(255, 255, 255, 0.5);
      --text: #222;
      --text-light: #555;
      --btn-bg: #b55;
      --btn-text: #fff;
      --bg: #f5f5f7;
    }
    .dark {
      --glass-bg: rgba(30, 30, 30, 0.5);
      --text: #eee;
      --text-light: #bbb;
      --btn-bg: #b39ddb;
      --btn-text: #111;
      --bg: #1c1c22;
    }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "misans-web-vf-font", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      background-image: radial-gradient(circle at 20% 20%, rgba(179, 157, 219, 0.25), transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(255, 187, 187, 0.18), transparent 50%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      touch-action: manipulation;
      transition: background 0.4s ease, color 0.4s ease;
    }
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(128, 128, 128, 0.3);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1001;
      color: var(--text);
      transition: all 0.4s ease;
    }
    .theme-toggle:active { transform: scale(0.9) rotate(90deg); }
    .wrap { width: 90%; max-width: 480px; }
    .glass-card {
      width: 100%;
      padding: 48px 28px 40px;
      border-radius: 24px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      text-align: center;
      transition: transform 0.4s ease, box-shadow 0.4s ease, background 0.4s ease;
    }
    .glass-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
    }
    .code {
      font-size: 96px;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #b39ddb 0%, #e0a6a6 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 4px;
      margin-bottom: 8px;
    }
    .dark .code { background: linear-gradient(135deg, #ceb6f0 0%, #f0b8b8 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .title { font-size: 20px; font-weight: 700; margin: 0 0 10px; }
    .desc { font-size: 14px; color: var(--text-light); line-height: 1.8; margin: 0 0 28px; }
    .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 22px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      background: var(--btn-bg);
      color: var(--btn-text);
      transition: transform 0.2s ease, opacity 0.2s ease, background 0.4s ease;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn.ghost {
      background: var(--glass-bg);
      border: 1px solid rgba(128, 128, 128, 0.35);
      color: var(--text);
    }
    .foot { margin-top: 18px; font-size: 12px; color: var(--text-light); text-align: center; }
    @media (max-width: 480px) {
      .glass-card { padding: 36px 18px 32px; }
      .code { font-size: 80px; }
    }
    @media (hover: none), (pointer: coarse) {
      .glass-card:hover, .btn:hover { transform: none !important; }
    }
    @media (prefers-reduced-motion: reduce) {
      .glass-card, .btn, .theme-toggle { transition: none !important; }
    }
  </style>
    <!-- MiSans 简繁中文 WebFont -->
    <link rel="stylesheet" href="/fonts/misans-web-vf-font/MiSans.min.css">
  </head>
<body>
  <button class="theme-toggle" id="theme-toggle" aria-label="切换夜间模式"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>

  <main class="wrap" role="main">
    <div class="glass-card">
      <div class="code" aria-hidden="true">404</div>
      <h1 class="title">页面走丢了喵</h1>
      <p class="desc">你要找的内容可能被移动、删除，或从未存在过。<br>检查一下网址，或者回首页逛逛吧～</p>
      <div class="btn-row">
        <a class="btn" href="/"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>返回首页</a>
        <a class="btn ghost" href="/blog"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>文章列表</a>
      </div>
    </div>
    <div class="foot">&copy; 2026 SkyCeria. AkiNard Blog</div>
  </main>

  <script>
    const MOON_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
    const SUN_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
    (function () {
      var body = document.body;
      var saved = localStorage.getItem('theme');
      if (saved === 'dark') body.classList.add('dark');
      var btn = document.getElementById('theme-toggle');
      function update() { btn.innerHTML = body.classList.contains('dark') ? SUN_SVG : MOON_SVG; }
      update();
      btn.addEventListener('click', function () {
        body.classList.toggle('dark');
        localStorage.setItem('theme', body.classList.contains('dark') ? 'dark' : 'light');
        update();
      });
    })();
  </script>
</body>
</html>
