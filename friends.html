<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>友情链接 - AkiNard Blog</title>
  <!-- SEO -->
  <meta name="description" content="AkiNard Blog - 世间万物不及你. 这里是 @SkyCeria 的个人博客。">
  <meta name="keywords" content="博客,个人博客,技术,生活">
  <meta property="og:title" content="友情链接 - AkiNard Blog">
  <meta property="og:description" content="朋友们的小站">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://test.578113.xyz/friends.html">
  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml" title="AkiNard Blog RSS" href="/rss.xml">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --glass-bg: rgba(255, 255, 255, 0.5);
      --text: #222;
      --text-light: #555;
      --border: rgba(128,128,128,0.2);
      --card-bg: rgba(255, 255, 255, 0.4);
      --btn-bg: #b55;
      --bg: #f5f5f7;
    }
    .dark {
      --glass-bg: rgba(30, 30, 30, 0.5);
      --text: #eee;
      --text-light: #bbb;
      --border: rgba(255,255,255,0.15);
      --card-bg: rgba(50, 50, 50, 0.4);
      --btn-bg: #cc7;
      --bg: #1c1c22;
    }

    body {
      font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", serif;
      margin: 0;
      padding: 20px;
      background-color: var(--bg, #f5f5f7);
      background-image: url('https://api.komll.com/images');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      transition: background 0.5s, color 0.5s;
      color: var(--text);
    }

    .glass-card {
      max-width: 600px;
      margin: 40px auto;
      padding: 24px;
      border-radius: 24px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      transition: background 0.5s, transform 0.3s, box-shadow 0.3s;
      opacity: 1;
      transform: scale(1);
      animation: pageEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1) backwards;
    }
    @keyframes pageEnter { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
    .glass-card:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,0.15); }

    h1 { text-align: center; margin-top: 0; }

    .friend-list { list-style: none; padding: 0; margin: 0; }
    .friend-item {
      display: flex;
      align-items: center;
      padding: 16px 12px;
      border-bottom: 1px solid var(--border);
      transition: background 0.3s, transform 0.3s, box-shadow 0.3s;
      border-radius: 12px;
      margin-bottom: 8px;
      background: var(--card-bg);
      opacity: 1;
      transform: translateY(0);
      animation: fadeUp 0.4s backwards;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .friend-item:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.1); }
    .friend-item:last-child { border-bottom: none; }
    .friend-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      margin-right: 16px;
      flex-shrink: 0;
      border: 2px solid var(--border);
    }
    .friend-info { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
    .friend-name { font-size: 17px; font-weight: 600; color: var(--text); text-decoration: none; margin-bottom: 4px; transition: color 0.3s; }
    .friend-name:hover { text-decoration: underline; }
    .friend-desc { font-size: 14px; color: var(--text-light); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(128,128,128,0.3);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1001;
      color: var(--text);
      transition: all 0.4s ease;
    }
    .theme-toggle:active { transform: scale(0.9) rotate(90deg); }

    a.back-link { display: block; text-align: center; margin-top: 20px; color: var(--text-light); font-size: 14px; }

    .footer-links {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: var(--text-light);
    }
    .footer-links a { color: var(--text-light); text-decoration: none; margin: 0 12px; transition: color 0.3s; }
    .footer-links a:hover { color: var(--btn-bg, #b55); }

    /* Umami 统计卡片 */
    .umami-stats-glass {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 18px;
      margin-top: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    }
    .umami-stats-container { text-align: center; color: var(--text); }
    .umami-stats-header { font-weight: 600; margin-bottom: 12px; font-size: 14px; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.05em; }
    .umami-stats-total { padding-bottom: 12px; margin-bottom: 8px; }
    .umami-stat-number { font-weight: 700; line-height: 1.2; }
    .umami-stat-label { font-size: 0.875rem; color: var(--text-light); margin-top: 2px; }
    .umami-stats-bottom { display: flex; justify-content: center; border-top: 1px solid rgba(128,128,128,0.2); padding-top: 12px; }
    .umami-stat-item { flex: 1; padding: 0 12px; }
    .umami-stat-item:first-child { border-right: 1px solid rgba(128,128,128,0.2); }
    .dark .umami-stats-bottom,
    .dark .umami-stat-item:first-child { border-color: rgba(255,255,255,0.15); }

    /* 移动端：缩短页边距、卡片加宽，背景改为随页面滚动 */
    @media (max-width: 480px) {
      body { padding: 12px; }
      .glass-card { width: 100%; margin: 16px auto; padding: 20px 16px; }
    }

    /* 触屏设备：去掉悬停位移带来的粘滞感 */
    @media (hover: none), (pointer: coarse) {
      .glass-card:hover, .friend-item:hover, .friend-name:hover,
      .footer-links a:hover {
        transform: none !important;
      }
    }

    /* 减弱动态效果：禁用动画并确保内容可见 */
    @media (prefers-reduced-motion: reduce) {
      .glass-card, .friend-item {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>
</head>
<body>
  <noscript>
    <div style="position:fixed;left:0;right:0;top:0;z-index:9999;background:#b55;color:#fff;text-align:center;padding:8px;font-size:13px;">本站内容依赖 JavaScript 渲染，请启用 JavaScript 后再访问。</div>
  </noscript>
  <button class="theme-toggle" id="theme-toggle" aria-label="切换夜间模式">🌙</button>

  <div class="glass-card">
    <h1>朋友们</h1>
    <ul class="friend-list" id="friend-list"></ul>
    <a class="back-link" href="index.html">← 返回首页</a>

    <!-- Umami 统计卡片 -->
    <div class="umami-stats-glass">
      <div class="umami-stats-container">
        <div class="umami-stats-header">统计</div>
        <div class="umami-stats-total">
          <div id="total-pageviews" class="umami-stat-number" style="font-size: 1.875rem;">-</div>
          <div class="umami-stat-label">总浏览量</div>
        </div>
        <div class="umami-stats-bottom">
          <div class="umami-stat-item">
            <div id="total-visits" class="umami-stat-number" style="font-size: 1.25rem;">-</div>
            <div class="umami-stat-label">访问数</div>
          </div>
          <div class="umami-stat-item">
            <div id="total-visitors" class="umami-stat-number" style="font-size: 1.25rem;">-</div>
            <div class="umami-stat-label">游客数</div>
          </div>
        </div>
      </div>
    </div>

    <div class="footer-links">
      <a href="/sitemap.xml">Sitemap</a>
      <a href="/rss.xml">RSS</a>
    </div>
  </div>

  <script>
    const toggleBtn = document.getElementById('theme-toggle');
    const body = document.body;
    const saved = localStorage.getItem('theme');
    if (saved === 'dark') body.classList.add('dark');
    updateBtn();
    toggleBtn.addEventListener('click', () => {
      body.classList.toggle('dark');
      localStorage.setItem('theme', body.classList.contains('dark') ? 'dark' : 'light');
      updateBtn();
    });
    function updateBtn() { toggleBtn.textContent = body.classList.contains('dark') ? '☀️' : '🌙'; }

    fetch('friends.json')
      .then(res => res.json())
      .then(friends => {
        const list = document.getElementById('friend-list');
        if (friends.length === 0) {
          list.innerHTML = '<li style="text-align:center; color: var(--text-light);">暂无友链</li>';
          return;
        }
        list.innerHTML = friends.map((f, i) => `
          <li class="friend-item" style="animation-delay: ${i * 0.1}s">
            <img class="friend-avatar" src="${f.avatar}" alt="${f.name}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23ddd%22/%3E%3C/svg%3E'">
            <div class="friend-info">
              <a class="friend-name" href="${f.url}" target="_blank" rel="noopener">${f.name}</a>
              <div class="friend-desc">${f.description || ''}</div>
            </div>
          </li>
        `).join('');
      })
      .catch(() => {
        document.getElementById('friend-list').innerHTML = '<li style="text-align:center; color: var(--text-light);">加载失败</li>';
      });

    // Umami 统计
    const UMAMI_CONFIG = {
      baseUrl: 'http://umami.578113.xyz/api',
      websiteId: 'd72bd4ca-e496-42b7-ae65-13424856f679',
      shareToken: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ3ZWJzaXRlSWQiOiJkNzJiZDRjYS1lNDk2LTQyYjctYWU2NS0xMzQyNDg1NmY2NzkiLCJpYXQiOjE3ODYwOTE3ODJ9.NxnoEMp0VPSdxLdVYmuSBeAfODvWTfazF7L1lalvlLg'
    };
    function formatNumber(num) {
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num.toString();
    }
    async function fetchUmamiStats() {
      try {
        const endAt = Date.now();
        const url = `${UMAMI_CONFIG.baseUrl}/websites/${UMAMI_CONFIG.websiteId}/stats?startAt=0&endAt=${endAt}&unit=hour&timezone=Asia%2FShanghai`;
        const resp = await fetch(url, { headers: { 'accept': 'application/json', 'x-umami-share-token': UMAMI_CONFIG.shareToken } });
        const data = await resp.json();
        document.getElementById('total-pageviews').textContent = formatNumber(data.pageviews || 0);
        document.getElementById('total-visits').textContent = formatNumber(data.visits || 0);
        document.getElementById('total-visitors').textContent = formatNumber(data.visitors || 0);
      } catch (e) { console.error(e); }
    }
    document.addEventListener('DOMContentLoaded', fetchUmamiStats);
    if (window.swup) window.swup.hooks.on('page:view', fetchUmamiStats);
  </script>
</body>
</html>
