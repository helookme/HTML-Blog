<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AkiNard Blog</title>
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.5);
      --text: #222;
      --text-light: #555;
      --btn-bg: #b55;
      --btn-text: #fff;
    }
    .dark {
      --glass-bg: rgba(30, 30, 30, 0.5);
      --text: #eee;
      --text-light: #bbb;
      --btn-bg: #cc7;
      --btn-text: #111;
    }

    body {
      font-family: "Noto Serif SC", serif;
      margin: 0;
      padding: 0;
      background-image: url('https://api.komll.com/images');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.5s, color 0.5s;
    }

    /* 毛玻璃卡片 */
    .glass-card {
      max-width: 600px;
      width: 90%;
      margin: 20px;
      padding: 40px 24px;
      border-radius: 24px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      color: var(--text);
      transition: background 0.5s, color 0.5s;
      text-align: center;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(128,128,128,0.3);
      margin-bottom: 20px;
    }

    .signature {
      font-size: 16px;
      color: var(--text-light);
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      background: var(--btn-bg);
      color: var(--btn-text);
      padding: 12px 32px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
      transition: background-color 0.5s, color 0.5s, transform 0.2s;
      border: none;
      cursor: pointer;
    }
    .btn:hover { transform: scale(1.05); }

    /* 夜间模式按钮 */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(128,128,128,0.3);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1001;
      color: var(--text);
      transition: background 0.5s, color 0.5s, transform 0.2s;
    }
    .theme-toggle:active { transform: scale(0.9); }
  </style>
</head>
<body>
  <button class="theme-toggle" id="theme-toggle" aria-label="切换夜间模式">🌙</button>

  <div class="glass-card">
    <img class="avatar" src="avatar.jpg" alt="头像">
    <p class="signature">世间万物不及你.<br>这里是 @SkyCeria 的个人博客。</p>
    <a class="btn" href="blog.html">阅读博客</a>
    <p style="margin-top: 20px;">
      <a href="friends.html" style="color: var(--text-light); text-decoration: none; font-size: 15px;">友链</a>
    </p>
  </div>

  <script>
    const toggleBtn = document.getElementById('theme-toggle');
    const body = document.body;

    const saved = localStorage.getItem('theme');
    if (saved === 'dark') body.classList.add('dark');
    updateBtn();

    toggleBtn.addEventListener('click', () => {
      body.classList.toggle('dark');
      const isDark = body.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      updateBtn();
    });

    function updateBtn() {
      toggleBtn.textContent = body.classList.contains('dark') ? '☀️' : '🌙';
    }
  </script>
</body>
</html>
