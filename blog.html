<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章列表 - AkiNard Blog</title>
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.5);
      --card-bg: rgba(255, 255, 255, 0.4);
      --text: #222;
      --text-light: #555;
      --link: #b55;
      --tag-bg: rgba(0,0,0,0.06);
      --tag-text: #444;
      --border: rgba(128,128,128,0.2);
    }
    .dark {
      --glass-bg: rgba(30, 30, 30, 0.5);
      --card-bg: rgba(50, 50, 50, 0.4);
      --text: #eee;
      --text-light: #bbb;
      --link: #cc7;
      --tag-bg: rgba(255,255,255,0.1);
      --tag-text: #ddd;
      --border: rgba(255,255,255,0.15);
    }

    body {
      font-family: "Noto Serif SC", serif;
      margin: 0;
      padding: 20px;
      background-image: url('https://api.komll.com/images');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      transition: background 0.5s, color 0.5s;
      color: var(--text);
      animation: fadeIn 0.6s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .glass-card {
      max-width: 600px;
      margin: 40px auto;
      padding: 24px;
      border-radius: 24px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      transition: background 0.5s, transform 0.3s, box-shadow 0.3s;
    }
    .glass-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.15);
    }

    h1 { text-align: center; margin-top: 0; }

    .search-box {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card-bg);
      color: var(--text);
      margin-bottom: 24px;
      box-sizing: border-box;
      backdrop-filter: blur(8px);
      transition: background 0.5s, border-color 0.5s, box-shadow 0.3s;
    }
    .search-box:focus {
      outline: none;
      border-color: var(--link);
      box-shadow: 0 0 0 3px rgba(181, 85, 85, 0.2);
    }
    .search-box::placeholder { color: var(--text-light); }

    /* 文章卡片依次出现 */
    .post-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      transition: background 0.5s, border-color 0.5s, transform 0.3s, box-shadow 0.3s;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.5s forwards;
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    .post-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
    }
    .post-card h2 { margin: 0 0 6px; font-size: 20px; }
    .post-card h2 a { color: var(--link); text-decoration: none; }
    .post-meta {
      font-size: 13px;
      color: var(--text-light);
      margin-bottom: 8px;
    }
    .post-desc {
      font-size: 14px;
      color: var(--text-light);
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      background: var(--tag-bg);
      color: var(--tag-text);
      padding: 2px 12px;
      border-radius: 12px;
      font-size: 12px;
      transition: background 0.5s, color 0.5s;
    }

    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(128,128,128,0.3);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1001;
      color: var(--text);
      transition: all 0.4s ease;
    }
    .theme-toggle:active { transform: scale(0.9) rotate(90deg); }

    a.back-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      color: var(--text-light);
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="theme-toggle" aria-label="切换夜间模式">🌙</button>

  <div class="glass-card">
    <h1>文章列表</h1>
    <input type="text" class="search-box" id="search" placeholder="搜索标题、描述或标签...">
    <div id="posts-container">加载中...</div>
    <a class="back-link" href="index.html">← 返回首页</a>
  </div>

  <script>
    const toggleBtn = document.getElementById('theme-toggle');
    const body = document.body;
    const saved = localStorage.getItem('theme');
    if (saved === 'dark') body.classList.add('dark');
    updateBtn();
    toggleBtn.addEventListener('click', () => {
      body.classList.toggle('dark');
      localStorage.setItem('theme', body.classList.contains('dark') ? 'dark' : 'light');
      updateBtn();
    });
    function updateBtn() { toggleBtn.textContent = body.classList.contains('dark') ? '☀️' : '🌙'; }

    let allPosts = [];
    fetch('blog.json')
      .then(res => res.json())
      .then(posts => {
        allPosts = posts;
        renderPosts(posts);
      })
      .catch(() => {
        document.getElementById('posts-container').innerText = '加载文章失败';
      });

    function renderPosts(posts) {
      const container = document.getElementById('posts-container');
      if (posts.length === 0) {
        container.innerHTML = '<p>没有找到文章</p>';
        return;
      }
      // 为每个卡片设置递增的动画延迟
      container.innerHTML = posts.map((post, i) => `
        <div class="post-card" style="animation-delay: ${i * 0.1}s">
          <h2><a href="reader.html?slug=${encodeURIComponent(post.slug)}">${post.title}</a></h2>
          <div class="post-meta">${post.published || ''} · ${post.category || ''}</div>
          ${post.description ? `<div class="post-desc">${post.description}</div>` : ''}
          ${post.tags && post.tags.length ? `
            <div class="tags">${post.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}</div>
          ` : ''}
        </div>
      `).join('');
    }

    document.getElementById('search').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = allPosts.filter(p =>
        p.title.toLowerCase().includes(term) ||
        (p.description && p.description.toLowerCase().includes(term)) ||
        (p.tags && p.tags.some(t => t.toLowerCase().includes(term))) ||
        (p.content && p.content.toLowerCase().includes(term))
      );
      renderPosts(filtered);
    });
  </script>
</body>
</html>
